<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1320, initial-scale=1" />
  <title>Eval — Forest Green redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:  ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"Source Serif 4"', 'ui-serif', 'Georgia', 'serif'],
            mono:  ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-feature-settings: 'ss01', 'cv11', 'cv05';
      letter-spacing: -0.005em;
      background: #f6f7f4;
      color: #022c22;
    }
    .font-serif { letter-spacing: -0.012em; }
    /* Crisp tabular numbers for data tables */
    .tabular-nums { font-variant-numeric: tabular-nums; }
    /* Soft hairlines */
    table { border-collapse: separate; border-spacing: 0; }
    /* Hide native select arrow in Firefox */
    select { background-image: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="preview/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/design-system.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/screens-tables.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/screens-detail.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/screens-matrix.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/screens-forms.jsx"></script>
  <script type="text/babel" data-presets="react" src="preview/app.jsx"></script>
</body>
</html>
